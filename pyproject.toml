[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-unlock"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
# Exact pins live in requirements.txt.
dependencies = ["numpy", "opencv-python", "onnxruntime", "psutil", "pywin32"]

[tool.setuptools]
packages = ["face_unlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
